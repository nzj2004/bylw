server:
  port: 8080

spring:
  application:
    name: job-recruitment
  datasource:
    url: jdbc:mysql://localhost:3306/job_recruitment?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.recruitment.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: jobRecruitmentSecretKey2024ForJwtTokenGeneration
  expiration: 86400000

# 文件上传配置
file:
  upload:
    # 上传基础路径（可以使用绝对路径或相对路径）
    base-path: ${user.dir}/uploads/
    # 图片子路径
    image-path: images/
    # PDF子路径
    pdf-path: pdfs/
    # 文件大小限制（字节）
    max-image-size: 5242880  # 5MB
    max-pdf-size: 10485760   # 10MB

logging:
  level:
    com.recruitment: debug
